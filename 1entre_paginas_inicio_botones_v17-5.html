function saveTimedReadingSession(e,id){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries()),b=bookBy(id);if(!b)return;let minutes=Math.max(1,Number(d.minutes)||1),pagesRead=Math.max(0,Number(d.pagesRead)||0),date=localDate();b.status=['actual','pausado','tumba','terminado'].includes(d.nextStatus)?d.nextStatus:'actual';b.totalReadingMinutes=(Number(b.totalReadingMinutes)||0)+minutes;b.readingTimerStarted=null;b.readingElapsedSeconds=0;if(Number(b.pages)>0&&d.currentPage!==''){let current=Math.max(0,Math.min(Number(b.pages),Number(d.currentPage)||0));b.progress=Math.round(current/Number(b.pages)*100)}else if(pagesRead>0&&Number(b.pages)>0)b.progress=Math.min(100,Math.round(((Number(b.pages)*Number(b.progress||0)/100)+pagesRead)/Number(b.pages)*100));state.sessions=state.sessions||[];state.sessions.push({id:String(Date.now()),bookId:id,date,minutes,pagesRead,note:d.note||''});state.readingDays[date]=true;if(d.note.trim()){let q={id:String(Date.now()+1),quote:d.note.trim(),bookId:id,location:d.currentPage?'Página '+d.currentPage:'',createdAt:new Date().toISOString(),date,noteType:'nota'};state.quotes=state.quotes||[];state.quotes.push(q);b.notes=Array.isArray(b.notes)?b.notes:[];b.notes.push({text:q.quote,location:q.location,createdAt:q.createdAt})}if(d.quote.trim()){state.quotes=state.quotes||[];state.quotes.push({id:String(Date.now()+2),quote:d.quote.trim(),bookId:id,location:d.currentPage?'Página '+d.currentPage:'',createdAt:new Date().toISOString(),date,noteType:'frase'})}if(b.status==='terminado'||Number(b.progress)>=100){b.status='terminado';b.progress=100;b.finishedAt=date}else if(b.status==='pausado'){b.pausedAt=date}else if(b.status==='tumba'){b.abandonedAt=date}save();clearInterval(window.readingClockInterval);closeModal();render();toast('Lectura guardada: '+minutes+' min · '+pagesRead+' '+(/ebook|digital|kindle|e-book/i.test(String(b.format||''))?'capítulos':'páginas'))}

stat-round" onclick="showPage('inicio')" aria-label="Volver">←</button><button class="stat-round" onclick="showPage('estadisticas-hoy')" aria-label="Estadísticas">☷</button></div><h2>Estadísticas diarias</h2><div class="muted">Tu recorrido de lectura, sesión por sesión.</div><div class="month-chip">${monthName}</div><div class="date-strip">${strip}</div><div class="ring-card"><div class="ring">${Math.min(100,Math.round(mins/Math.max(1,Number(state.dailyGoal)||20)*100))}%</div><div><b>Tiempo de lectura</b><div style="margin-top:8px">⏱ <strong>${mins} min</strong><span class="muted"> / ${Number(state.dailyGoal)||20} min</span></div><div class="muted small">${pages} páginas · ${sessions.length} sesiones</div></div></div><div style="font-size:18px;margin-bottom:26px">${now.getDate()} de ${now.toLocaleDateString('es-CO',{month:'long',year:'numeric'})}</div><div class="rule-heading">Libros leídos</div>${books}<div class="rule-heading">Todas las sesiones</div>${all}</div>`}

</script>

<script id="entre-paginas-custom-genre-picker-script">
(function(){
 const genres=['Gótico','Terror','Romance','Fantasía','Misterio','Clásicos','Ciencia ficción','Histórica','Thriller','Contemporánea','Poesía','No ficción','Otro'];
 window.openGenrePicker=function(){
  if(document.querySelector('.genre-picker-backdrop'))return;
  const input=document.getElementById('bookGenreField'); if(!input)return;
  const backdrop=document.createElement('div');backdrop.className='genre-picker-backdrop';backdrop.setAttribute('role','presentation');
  const dialog=document.createElement('div');dialog.className='genre-picker-dialog';dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.setAttribute('aria-label','Elegir género');
  const heading=document.createElement('div');heading.className='genre-picker-heading';heading.textContent='Elegir género';dialog.appendChild(heading);
  const list=document.createElement('div');list.className='genre-picker-options';list.setAttribute('role','radiogroup');
  const options=['',...genres];
  options.forEach(g=>{const b=document.createElement('button');b.type='button';b.className='genre-picker-option';b.setAttribute('role','radio');b.setAttribute('aria-checked',String((input.value||'')===g));b.textContent=g||'Sin género';b.addEventListener('click',()=>{input.value=g;input.dispatchEvent(new Event('change',{bubbles:true}));const label=document.getElementById('genrePickerLabel');if(label)label.textContent=g||'Elegir género';backdrop.remove();document.getElementById('genrePickerTrigger')?.focus({preventScroll:true});});list.appendChild(b)});
  dialog.appendChild(list);backdrop.appendChild(dialog);backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.remove()});document.addEventListener('keydown',function esc(e){if(e.key==='Escape'&&backdrop.isConnected){backdrop.remove();document.removeEventListener('keydown',esc)}});document.body.appendChild(backdrop);
  const selected=list.querySelector('[aria-checked="true"]');(selected||list.firstElementChild)?.scrollIntoView({block:'nearest'});
 };
 document.addEventListener('change',e=>{if(e.target&&e.target.id==='bookGenreField'){const label=document.getElementById('genrePickerLabel');if(label)label.textContent=e.target.value||'Elegir género'}});
 const observer=new MutationObserver(()=>{const input=document.getElementById('bookGenreField'),label=document.getElementById('genrePickerLabel');if(input&&label){const next=input.value||'Elegir género';if(label.textContent!==next)label.textContent=next;}});observer.observe(document.body,{childList:true,subtree:true});
})();
</script>
















<style id="ep-mobile-scroll-fix-v12">
/* En móvil, permitir el desplazamiento vertical normal de la página y evitar capas que lo bloqueen. */
html, body { height:auto !important; min-height:100% !important; overflow-y:auto !important; overflow-x:hidden !important; touch-action:pan-y !important; }
body { position:static !important; overscroll-behavior-y:auto !important; -webkit-overflow-scrolling:touch; }
.app { min-height:100dvh; }
#main { height:auto !important; min-height:0 !important; overflow:visible !important; touch-action:pan-y !important; }
#modalroot:empty { display:none !important; pointer-events:none !important; }
.nav { pointer-events:auto !important; }

/* Fallback visible en el primer paso de agregar libro: evita dejar atrapada la usuaria si el catálogo no responde */
.cover-step-actions{display:none;margin:16px 0 28px;padding:12px 0 18px;position:sticky;bottom:0;background:var(--cream,#fffaf2);z-index:8;border-top:1px solid var(--line,#e5d8c8)}

</style>
<script id="ep-nav-safe-fallback-v12">
(function(){
  // Respaldo pasivo: solo si el botón de navegación no actualizó la sección.
  // No cancela, duplica ni intercepta el clic original.
  document.addEventListener('click', function(ev){
    var button = ev.target && ev.target.closest ? ev.target.closest('.nav button[data-page]') : null;
    if (!button || button.disabled) return;
    var page = button.getAttribute('data-page');
    if (!page) return;
    setTimeout(function(){
      var active = document.querySelector('.nav button.active');
      if ((!active || active.getAttribute('data-page') !== page) && typeof window.showPage === 'function') {
        try { window.showPage(page); } catch (err) { console.error('No se pudo abrir la sección ' + page, err); }
      }
    }, 50);
  }, false);
})();
</script>
