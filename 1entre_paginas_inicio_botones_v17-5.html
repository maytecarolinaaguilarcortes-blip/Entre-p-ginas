function load(){let base={books:[],quotes:[],sessions:[],wishlist:[],goal:24,dailyGoal:20,reminderTime:'20:00',profileName:'Mayte',readingDays:{},settings:{},challenges:[],decorations:[],sagas:[]};try{let x=JSON.parse(localStorage.getItem(KEY))||{};let merged={...base,...x,sessions:x.sessions||[],wishlist:x.wishlist||[],challenges:x.challenges||[],decorations:x.decorations||[],sagas:x.sagas||[]};if(!merged.wishlist.length&&merged.books?.some(b=>b.status==='deseo')){merged.wishlist=merged.books.filter(b=>b.status==='deseo').map(b=>({id:b.id,title:b.title,author:b.author||''}));merged.books=merged.books.filter(b=>b.status!=='deseo')}merged.books=(merged.books||[]).map(b=>{const finishDate=b.finishedAt??b.finished_at??b.finishedDate??b.finished_date??b.finishDate??b.finish_date??b.dateFinished??b.date_finished??b.endDate??b.end_date??b.fechaFinalizacion??b.fecha_finalizacion??b.fecha_fin??b.fechaFin;const finishText=String(finishDate??'').trim();const pendingFinish=/^(pendiente|pending|—|-|sin fecha|no finalizado|no finalizada)$/i.test(finishText);const pendingStatus=/^(pendiente|pending|dnf|abandonado|abandonada)$/i.test(String(b.status||'').trim());const hasFinishedDate=!!finishText&&!/^(pendiente|pending|—|-|sin fecha|no finalizado|no finalizada)$/i.test(finishText);const shouldPause=(pendingStatus||pendingFinish)&&!hasFinishedDate;return {...b,status:shouldPause?'pausado':b.status,emotions:b.emotions&&typeof b.emotions==='object'?b.emotions:{},notes:Array.isArray(b.notes)?b.notes:[]}});merged.quotes=Array.isArray(merged.quotes)?merged.quotes:[];merged.readingDays=merged.readingDays&&typeof merged.readingDays==='object'?merged.readingDays:{};return merged}catch(e){return base}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(err){console.error('Entre Páginas: el navegador no permite guardar datos en este contexto.',err);if(!window.__epStorageWarningShown){window.__epStorageWarningShown=true;setTimeout(()=>{try{if(typeof toast==='function')toast('Esta vista no permite guardar cambios. Abre Entre Páginas desde su enlace web seguro para conservar tus datos.') }catch(_){ }},0)}return false}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bookBy(id){return state.books.find(b=>b.id===id)}function activeBooks(){return state.books.filter(b=>['actual','reading','reading_now','currently_reading'].includes(String(b.status||'').toLowerCase()))}function activeBook(){return activeBooks()[0]}function finished(){return state.books.filter(b=>['terminado','terminada','read','done','finished','completed','completado','completada'].includes(String(b.status||'').toLowerCase()))}function cover(b,small=false){let title=esc(b?.title||'Tu próxima historia');let colors=(b?.color||'#78634E').split('|');let url=b?.coverUrl||b?.thumbnail||'';return `<div class="cover ${url?'real-book-cover':''}" style="background:linear-gradient(145deg,${colors[0]},${colors[1]||'#A77B62'})">${url?`<img src="${esc(url)}" alt="Portada de ${title}" loading="lazy" onerror="this.remove();this.parentElement.classList.remove('real-book-cover')">` : ''}<span>${title}</span></div>`}
function btn(text,fn,kind=''){return `<button class="btn ${kind}" onclick="${fn}">${text}</button>`}
function section(title,right=''){return `<div class="section-head"><h3>${title}</h3>${right}</div>`}
function empty(text){return `<div class="empty">${text}</div>`}
function showPage(p){currentPage=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
window.addEventListener('error',function(e){try{console.error('Entre Páginas:',e.message,e.filename,e.lineno);if(e.message&&/Cannot read properties of null|Cannot read properties of undefined/.test(e.message))toast('Una función de esta hoja encontró un dato vacío. Cierra el aviso e intenta otra vez.');}catch(_){}});window.addEventListener('unhandledrejection',function(e){try{console.error('Entre Páginas, promesa:',e.reason); }catch(_){}});
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;document.querySelectorAll('.install-banner').forEach(x=>x.classList.add('show'))});function installApp(){if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.then(()=>{deferredInstallPrompt=null});}else toast('Para instalarla, abre el menú del navegador y elige “Instalar aplicación” o “Añadir a pantalla de inicio”.')}if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
async function lookupBookCover(b){if(!b||b.coverUrl||b.thumbnail||!b.title||b.coverLookupTried)return false;b.coverLookupTried=true;const queries=[];if(b.isbn)queries.push('isbn:'+b.isbn);queries.push('intitle:'+b.title+(b.author?' inauthor:'+b.author:''));if(b.author)queries.push('intitle:'+b.title);queries.push(b.title+(b.author?' '+b.author:''));for(const q of queries){try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=10&printType=books');if(!r.ok)continue;const d=await r.json();const items=d.items||[];const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();const target=norm(b.title),author=norm(b.author);const ranked=items.filter(x=>x.volumeInfo?.imageLinks).map(x=>{const v=x.volumeInfo;const title=norm(v.title);const authors=(v.authors||[]).map(norm).join(' ');let score=0;if(title===target)score+=5;else if(title.includes(target)||target.includes(title))score+=2;if(author&&authors.includes(author))score+=3;if(v.industryIdentifiers?.some(i=>i.identifier===b.isbn))score+=10;return {v,score}}).sort((a,c)=>c.score-a.score);const hit=ranked[0];if(hit){let url=hit.v.imageLinks.extraLarge||hit.v.imageLinks.large||hit.v.imageLinks.medium||hit.v.imageLinks.thumbnail||hit.v.imageLinks.smallThumbnail;if(url){b.coverUrl=url.replace(/^http:/,'https:').replace('&edge=curl','');save();return true}}}catch(e){}}try{const url='https://openlibrary.org/search.json?title='+encodeURIComponent(b.title)+(b.author?'&author='+encodeURIComponent(b.author):'')+'&limit=15';const r=await fetch(url);if(r.ok){const d=await r.json();const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();const target=norm(b.title),author=norm(b.author);const docs=(d.docs||[]).filter(x=>x.cover_i).map(x=>{const title=norm(x.title),authors=(x.author_name||[]).map(norm).join(' ');let score=title===target?5:(title.includes(target)||target.includes(title)?2:0);if(author&&authors.includes(author))score+=3;return {x,score}}).sort((a,c)=>c.score-a.score);if(docs.length){b.coverUrl='https://covers.openlibrary.org/b/id/'+docs[0].x.cover_i+'-M.jpg';b.coverLookupTried=true;save();return true}}}catch(e){}return false}
async function lookupMissingBookCovers(force=false){if(!navigator.onLine)return;let changed=false;for(const b of (state.books||[])){if(!b.coverUrl&&!b.thumbnail&&(!b.coverLookupTried||force)){b.coverLookupTried=false;if(await lookupBookCover(b))changed=true;await new Promise(resolve=>setTimeout(resolve,220))}}if(changed)render()}
function render(){const m=document.getElementById('main');if(!m)return;try{applyAppTheme(state.settings?.theme||'Café clásico');state.books=Array.isArray(state.books)?state.books:[];state.quotes=Array.isArray(state.quotes)?state.quotes:[];state.sessions=Array.isArray(state.sessions)?state.sessions:[];state.wishlist=Array.isArray(state.wishlist)?state.wishlist:[];state.readingDays=state.readingDays&&typeof state.readingDays==='object'?state.readingDays:{};if(currentPage==='inicio')m.innerHTML=home();else if(currentPage==='perfil')m.innerHTML=profile();else if(currentPage==='librero')m.innerHTML=shelf();else if(currentPage==='ideas')m.innerHTML=ideas();else if(currentPage==='medallas')m.innerHTML=medals();else if(currentPage==='retos')m.innerHTML=challenges();else if(currentPage==='ajustes')m.innerHTML=settings();else if(currentPage==='deseos')m.innerHTML=wishlistPage();else if(currentPage==='tbr')m.innerHTML=tbrPage();else if(currentPage==='estadisticas-hoy')m.innerHTML=dailyStatsPage();else if(currentPage==='estadisticas-completas')m.innerHTML=comprehensiveStatsPage();else m.innerHTML=home();const topBar=document.querySelector('.top');if(topBar)topBar.style.display=currentPage==='ajustes'?'none':'';const brand=document.querySelector('.top .brand');if(brand)brand.style.display=currentPage==='librero'?'none':'';const tagline=document.querySelector('.top .tagline');if(tagline)tagline.textContent=currentPage==='ideas'?(''+state.quotes.length+' notas guardadas'):'Tu biblioteca, tu historia.';const topActions=document.querySelector('.top .top-actions');if(topActions){if(currentPage==='ideas'){topActions.style.display='flex';topActions.classList.add('notes-top-actions');topActions.innerHTML=`<button class="iconbtn" aria-label="Mi perfil" onclick="showPage('perfil')">♙</button><button class="iconbtn" aria-label="Ajustes" onclick="showPage('ajustes')">⚙</button>`}else{topActions.classList.remove('notes-top-actions');topActions.style.display=currentPage==='librero'?'none':'';topActions.innerHTML=`<button class="iconbtn" aria-label="Mi perfil" onclick="showPage('perfil')">♙</button><button class="iconbtn" aria-label="Ajustes" onclick="showPage('ajustes')">⚙</button>`}}if(currentPage==='ajustes')wireSettingsAccordion();try{updateReminderTimer()}catch(e){}if(currentPage==='perfil')loadSagaCovers();if(currentPage==='librero')ensureShelfSpineColors();if(currentPage==='deseos')state.wishlist.filter(b=>!b.coverUrl).slice(0,8).forEach(b=>lookupWishlistCover(b.id));if(currentPage==='medallas')loadMedalCovers()}catch(err){console.error('Error al mostrar Entre Páginas:',err);/* No devolver al inicio por un fallo secundario: conservar la hoja solicitada. */if(m&&!m.innerHTML.trim()){m.innerHTML='<div class="card empty"><p>No se pudo cargar esta sección.</p><button class="btn secondary" type="button" onclick="showPage(\'inicio\')">Volver al inicio</button></div>';}const topBar=document.querySelector('.top');if(topBar)topBar.style.display=currentPage==='ajustes'?'none':'';const brand=document.querySelector('.top .brand');if(brand)brand.style.display=currentPage==='librero'?'none':'';}}
function home(){let actives=activeBooks(),b=actives[0],last=finished().slice().sort((a,b)=>(b.finishedAt||'').localeCompare(a.finishedAt||''))[0],next=state.books.find(x=>x.status==='proximo'||x.status==='tbr');let month=new Date(),year=month.getFullYear(),mo=month.getMonth(),first=new Date(year,mo,1).getDay(),days=new Date(year,mo+1,0).getDate();let names=['L','M','M','J','V','S','D'];let offset=(first+6)%7;let cal=names.map(n=>`<div class="dayname">${n}</div>`).join('');for(let i=0;i<offset;i++)cal+='<div class="day"></div>';for(let d=1;d<=days;d++){let key=`${year}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cal+=`<div class="day ${state.readingDays[key]?'read':''} ${d===month.getDate()?'today':''}">${d}</div>`}let week=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];let today=new Date();let start=new Date(today);let wd=(today.getDay()+6)%7;start.setDate(today.getDate()-wd);let streak=week.map((w,i)=>{let dt=new Date(start);dt.setDate(start.getDate()+i);let k=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;return `<div class="streakday">${w}<div class="streakdot ${state.readingDays[k]?'done':''}">${state.readingDays[k]?'✓':'·'}</div></div>`}).join('');let streakCount=0;for(let i=0;i<365;i++){let dt=new Date();dt.setDate(dt.getDate()-i);let k=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;if(state.readingDays[k])streakCount++;else if(i>0)break}let f=finished(),rated=f.filter(x=>Number(x.rating)>0),avg=rated.length?rated.reduce((sum,x)=>sum+Number(x.rating),0)/rated.length:0;let todaySessions=(state.sessions||[]).filter(x=>x.date===localDate()),pagesToday=todaySessions.reduce((sum,x)=>sum+(Number(x.pagesRead)||0),0),sessionCount=todaySessions.length;let wishCount=(state.wishlist||[]).length,tbrCount=state.books.filter(x=>x.status==='tbr'||x.status==='proximo').length;
return `<div class="hello hello-with-add"><div class="hello-copy"><h2>¡Hola, ${esc(state.profileName||'lectora')}! ☕</h2><div class="muted">¿Qué historia te acompaña hoy?</div></div><button type="button" class="btn home-add-book" onclick="openAdd()"><span aria-hidden="true">＋</span> Agregar libro</button></div>${monthlyPlanCard()}<div class="homegrid"><div class="homeleft"><section class="card"><div class="section-head current-section-head"><h3>Mi lectura actual</h3></div>${actives.length?`<div class="current-carousel">${actives.map((book,i)=>{let readPages=book.pages?Math.round(book.pages*(Number(book.progress)||0)/100):0;let left=book.pages?Math.max(0,Number(book.pages)-readPages):0;let paceRows=(state.sessions||[]).filter(s=>s.bookId===book.id&&Number(s.pagesRead)>0&&Number(s.minutes)>0);let pace=paceRows.length?paceRows.reduce((n,s)=>n+Number(s.pagesRead),0)/paceRows.reduce((n,s)=>n+Number(s.minutes),0):1;let remainM=left?Math.max(0,Math.ceil(left/Math.max(.1,pace))):0;let remain=left?`Quedan ${Math.floor(remainM/60)} h ${String(remainM%60).padStart(2,'0')} min`:`${Math.max(0,100-(Number(book.progress)||0))}% por leer`;let running=book.readingTimerStarted?Math.max(0,Math.floor((Date.now()-Number(book.readingTimerStarted))/60000)):0;let runningSeconds=(Number(book.readingElapsedSeconds)||0)+(book.readingTimerStarted?Math.max(0,Math.floor((Date.now()-Number(book.readingTimerStarted))/1000)):0);let timerActive=!!book.readingTimerStarted;let timerExists=timerActive||Number(book.readingElapsedSeconds)>0;return `<article class="current current-slide"><div class="current-cover-action" onclick="chooseBookStatus('${book.id}')" role="button" tabindex="0">${cover(book)}</div><div><div class="pill">${actives.length>1?`Lectura ${i+1} de ${actives.length}`:'Leyendo ahora'}</div><h3 class="book-title">${esc(book.title)}</h3><div class="muted small">${esc(book.author||'Autor sin registrar')}</div><div class="progress"><span style="width:${Math.max(0,Math.min(100,Number(book.progress)||0))}%"></span></div><div class="statsline"><span>${Number(book.progress)||0}% leído</span><span>${book.pages?`${Math.max(0,Math.round(book.pages*(Number(book.progress)||0)/100))} páginas leídas`:'Lectura en curso'}</span><span>${book.pages?`${left} páginas por leer`:`${Math.max(0,100-(Number(book.progress)||0))}% por leer`}</span></div><div class="current-time-left">⏳ ${remain}</div>${timerExists?`<div class="live-reading-clock">⏱ ${String(Math.floor(runningSeconds/3600)).padStart(2,'0')}:${String(Math.floor((runningSeconds%3600)/60)).padStart(2,'0')}:${String(runningSeconds%60).padStart(2,'0')} ${timerActive?'':'· En pausa'}</div>`:''}<div style="margin-top:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center">${btn(timerActive?'⏱ Continuar lectura':(timerExists?'▶ Reanudar lectura':'▶ Leer'),`openReadingTimerSheet('${book.id}')`,'secondary')}<button class="btn outline note-icon-button" type="button" aria-label="Añadir nota" title="Añadir nota" onclick="quickBookNote('${book.id}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h10l4 4V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M15 3.5V8h4M12 11v7M8.5 14.5h7"/></svg></button></div></div></article>`}).join('')}</div>${actives.length>1?`<div class="small muted" style="margin-top:9px;text-align:center">Desliza hacia la derecha para ver tus otras lecturas →</div>`:''}`:`<div class="empty">Tu próxima aventura puede empezar aquí.<br><br>${btn('Añadir mi lectura actual','openAdd()')}</div>`}</section><div class="card daily-card" role="button" tabindex="0" onclick="showPage('estadisticas-hoy')" style="cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 class="daily-card-title">Mis estadísticas de hoy</h3><span aria-hidden="true">↗</span></div><div class="statsgrid"><div class="stat"><strong>${todayMinutes()}</strong><span>Minutos leídos</span></div><div class="stat"><strong>${pagesToday}</strong><span>Páginas leídas</span></div><div class="stat"><strong>${sessionCount}</strong><span>Jornadas</span></div></div></div>${section('Mi calendario de lectura')}<div class="card"><div style="font-family:Georgia,serif;font-size:16px;margin-bottom:12px">${month.toLocaleDateString('es-CO',{month:'long',year:'numeric'})}</div><div class="calendar">${cal}</div><div style="margin-top:12px">${btn('Hoy leí 📖','markRead()','secondary')}</div></div></div><div class="homeright">${section('Mi recorrido lector')}<div class="card"><div class="tri-grid">${journeyMini(last,'Última lectura','Último libro terminado')}${journeyMini(b,'Lectura actual','En tus manos hoy')}${journeyMini(next,'Próxima lectura','Tu siguiente aventura')}</div></div>${section('Mi racha lectora')}<div class="card"><div style="font-family:Georgia,serif;font-size:23px;margin-bottom:12px">🔥 ${streakCount} ${streakCount===1?'día':'días'} seguidos</div><div class="streak">${streak}</div></div><div class="compact-collections"><button class="collection-tile" onclick="showPage('deseos')"><span class="collection-icon">♡</span><span class="collection-label">Lista de deseos</span><b>${wishCount}</b></button><button class="collection-tile" onclick="showPage('tbr')"><span class="collection-icon">▤</span><span class="collection-label">TBR</span><b>${tbrCount}</b></button></div></div></div>`}
function mini(b,label,desc){const isNext=label==='Próxima lectura';return `<div class="mini-book">${b?cover(b):`<div class="cover" style="background:linear-gradient(145deg,#DCCBB5,#F6F0E6);color:#78634E"><span>＋</span></div>`}<b>${isNext?'Próxima lectura':b?esc(b.title):label}</b><p>${isNext?desc:b?esc(b.author||''):desc}</p></div>`}
function wishlistPage(){let a=state.wishlist||[];return `<div class="wishlist-heading"><h2 class="page-title">♡ Lista de deseos</h2><button type="button" class="wishlist-add-plus" aria-label="Añadir libro a deseos" title="Añadir libro" onclick="addWishlist()">+</button></div><div class="card"><div class="small muted" style="margin-bottom:10px">${a.length} libro${a.length===1?'':'s'} guardado${a.length===1?'':'s'}</div>${a.length?`<div class="wishlist-cover-grid">${a.map(b=>`<article class="wishlist-cover-item"><button type="button" class="wishlist-cover-open" onclick="openWishlistBook('${b.id}')" aria-label="Ver ${esc(b.title)}">${b.coverUrl?`<img src="${esc(b.coverUrl)}" alt="Portada de ${esc(b.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<span class="wishlist-cover-placeholder" style="${b.coverUrl?'display:none;':''}">📖<b>${esc(b.title)}</b></span></button><h4>${esc(b.title)}</h4><p>${esc(b.author||'Autor por confirmar')}</p></article>`).join('')}</div>`:empty('Todavía no has agregado libros a tu lista de deseos.')}</div>`} 
async function lookupWishlistCover(id){let b=(state.wishlist||[]).find(x=>x.id===id);if(!b||b.coverUrl||!b.title)return;try{const q='intitle:'+b.title+(b.author?' inauthor:'+b.author:'');const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=10&printType=books');if(!r.ok)return;const d=await r.json();const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();const hit=(d.items||[]).map(x=>x.volumeInfo||{}).filter(v=>v.imageLinks).map(v=>({v,score:(norm(v.title)===norm(b.title)?5:(norm(v.title).includes(norm(b.title))||norm(b.title).includes(norm(v.title))?2:0))+(b.author&&(v.authors||[]).some(a=>norm(a)===norm(b.author))?3:0)})).sort((a,c)=>c.score-a.score)[0];if(hit&&hit.score>=2){const im=hit.v.imageLinks;b.coverUrl=(im.extraLarge||im.large||im.medium||im.thumbnail||im.smallThumbnail||'').replace(/^http:/,'https:');save();if(currentPage==='deseos')render()}}catch(e){}}function openWishlistBook(id){const b=(state.wishlist||[]).find(x=>x.id===id);if(!b)return;modal(`<div class="modalhead"><h3>${esc(b.title)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="wish-detail">${b.coverUrl?`<img src="${esc(b.coverUrl)}" alt="Portada de ${esc(b.title)}">`:''}<div><b>${esc(b.title)}</b><p class="muted">${esc(b.author||'Autor por confirmar')}</p><button class="btn" onclick="promoteWishToBook('${b.id}')">Agregar a mi biblioteca</button></div></div>`)}function promoteWishToBook(id){const w=(state.wishlist||[]).find(x=>x.id===id);if(!w)return;closeModal();openAddForm('manual');setTimeout(()=>{const t=document.getElementById('bookTitleInput');if(t){t.value=w.title;t.dataset.selectedTitle=w.title;scheduleManualBookLookup()}const a=document.getElementById('bookAuthorInput');if(a)a.value=w.author||'';const c=document.getElementById('bookCoverUrl');if(c)c.value=w.coverUrl||''},80)}

function shelfSpineStyle(b){let fallback=(b.color||'#78634E|#A77B62').split('|')[0]||'#78634E';let url=b.coverUrl||b.thumbnail||'';if(b.spineColor)return `background:linear-gradient(150deg,${b.spineColor},${b.spineShade||b.spineColor})`;if(url)return `background-color:${fallback};background-image:linear-gradient(90deg,rgba(0,0,0,.30),rgba(255,255,255,.10)),url('${String(url).replace(/'/g,'%27')}');background-size:cover;background-position:center`;return `background:linear-gradient(150deg,${fallback},${(b.color||'#78634E|#A77B62').split('|')[1]||'#A77B62'})`}
function ensureShelfSpineColors(){if(currentPage!=='librero')return;let pending=(state.books||[]).filter(b=>!b.spineColor&&(b.coverUrl||b.thumbnail)&&!b.spineColorTried);pending.forEach(b=>{b.spineColorTried=true;let img=new Image();img.crossOrigin='anonymous';img.onload=()=>{try{let c=document.createElement('canvas'),w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return;c.width=Math.min(80,w);c.height=Math.min(120,h);let ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);let data=ctx.getImageData(0,0,c.width,c.height).data,bins={};for(let y=Math.floor(c.height*.12);y<c.height*.88;y+=3){for(let x=Math.floor(c.width*.12);x<c.width*.88;x+=3){let i=(y*c.width+x)*4,r=data[i],g=data[i+1],bl=data[i+2],max=Math.max(r,g,bl),min=Math.min(r,g,bl);if(max>246&&max-min<18)continue;let key=[r,g,bl].map(v=>Math.round(v/32)*32).map(v=>Math.min(255,v)).join(',');bins[key]=(bins[key]||0)+1}}let best=Object.entries(bins).sort((a,b)=>b[1]-a[1])[0];if(!best)return;let rgb=best[0].split(',').map(Number),hex='#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');b.spineColor=hex;b.spineShade='#'+rgb.map(v=>Math.max(0,Math.round(v*.78)).toString(16).padStart(2,'0')).join('');save();if(currentPage==='librero')render()}catch(e){}};img.onerror=()=>{};img.src=b.coverUrl||b.thumbnail})}
function shelf(){let physical=state.books.filter(b=>(b.format||'Físico')==='Físico'&&b.acquisition!=='Me lo prestaron'&&b.owned!==false);let shelves=Array.from({length:6},(_,i)=>{let books=physical.filter(b=>(Number(b.shelfIndex)||0)===i);let dec=(state.decorations||[]).filter(d=>Number(d.shelf)===i);let items=[...books.map((b,j)=>({kind:'book',html:`<div class="billy-book" draggable="true" ondragstart="dragShelfBook(event,'${b.id}')" onclick="openBook('${b.id}')" title="${esc(b.title)} · ${esc(b.author||'')}" style="--h:${58+((j*17+String(b.id).length*5)%43)}px;--w:${Math.max(16,Math.min(38,14+Math.round((Number(b.pages)||180)/28)))}px;${shelfSpineStyle(b)}"><span>${esc(b.title)}</span></div>`})),...dec.map(d=>({kind:'decor',html:`<div class="shelf-decor" title="${esc(d.label)}"><span>${d.emoji}</span><button type="button" onclick="removeDecoration('${d.id}')" aria-label="Quitar decoración">×</button></div>`}))];return `<div class="billy-shelf" data-shelf="${i}" ondragover="event.preventDefault()" ondrop="dropOnShelf(event,${i})">${items.length?items.map(x=>x.html).join(''):'<div class="billy-empty">Añade libros o decoración a este entrepaño</div>'}</div>`}).join('');let panelContent='';if(shelfPanel==='librero'){panelContent=`<div class="physical-view-switch" role="group" aria-label="Vista del inventario físico"><button type="button" class="${shelfView==='lomos'?'active':''}" onclick="setShelfView('lomos')">▤ Vista de lomos</button><button type="button" class="${shelfView==='portadas'?'active':''}" onclick="setShelfView('portadas')">▦ Vista de portadas</button></div>${shelfView==='lomos'?`<div class="billy-wrap"><div class="billy-case">${shelves}</div></div><div class="card" style="margin:12px 0"><h3 style="font-family:Georgia,serif;margin:0 0 10px">Decorar mi librero</h3><p class="muted small">Agrega las velas, plantas y pequeños adornos que tienes físicamente y elige en qué entrepaño van.</p><div class="formgrid"><div class="field"><label>Objeto decorativo</labe ro${arr.length===1?'':'s'} en ${sectionLabel}</div><div class="wishlist-cover-grid tbr-shelf-cover-grid status-cover-grid" style="margin-top:14px">${arr.length?arr.map(b=>`<article class="wishlist-cover-item"><button type="button" class="wishlist-cover-open" onclick="${shelfPanel==='tbr'?`chooseTbrBookAction('${b.id}')`:`chooseShelfBookStatus('${b.id}')`}" aria-label="${shelfPanel==='tbr'?'Ver detalles de':'Elegir acción para'} ${esc(b.title)}">${cover(b)}</button><h4>${esc(b.title)}</h4><p>${esc(b.author||'Autor sin registrar')}</p></article>`).join(''):empty(shelfPanel==='tbr'?'No tienes libros físicos pendientes en tu TBR.':shelfPanel==='pausados'?'No tienes libros físicos pausados.':'Tu tumba de libros está vacía.')}</div>`}return `<div class="shelf-heading"><div><h2 class="page-title">Mi librero</h2><p class="muted small shelf-count-line" style="margin:4px 0 0">📚 ${physical.length} libro${physical.length===1?' físico':'s físicos'} en tu colección. Cada historia tiene su lugar.</p></div><div class="shelf-heading-actions"><button class="iconbtn" aria-label="Mi perfil" title="Mi perfil" onclick="showPage('perfil')">♙</button><button class="iconbtn" aria-label="Configuración" title="Configuración" onclick="showPage('ajustes')">⚙</button></div></div><div class="quote-controls shelf-tabs"><button class="btn ${shelfPanel==='librero'?'':'secondary'}" onclick="setShelfPanel('librero')">Mi librero</button><button class="btn ${shelfPanel==='tbr'?'':'secondary'}" onclick="setShelfPanel('tbr')">Mi TBR</button><button class="btn ${shelfPanel==='pausados'?'':'secondary'}" onclick="setShelfPanel('pausados')">Pausados</button><button class="btn ${shelfPanel==='tumba'?'':'secondary'}" onclick="setShelfPanel('tumba')">Tumba de libros</button></div>${panelContent}`}

function filterPhysicalInventory(){const root=document.querySelector('.physical-inventory-grid');if(!root)return;const q=(document.getElementById('physicalInventorySearch')?.value||'').trim().toLocaleLowerCase('es');const sort=document.getElementById('physicalInventorySort')?.value||'title';const cards=Array.from(root.querySelectorAll('.physical-inventory-item'));cards.sort((a,b)=>(a.dataset[sort]||'').localeCompare(b.dataset[sort]||'','es'));cards.forEach(card=>root.appendChild(card));let shown=0;cards.forEach(card=>{const match=!q||(card.dataset.title+' '+card.dataset.author+' '+card.dataset.genre).toLocaleLowerCase('es').includes(q);card.hidden=!match;if(match)shown++});const count=document.getElementById('physicalInventoryCount');if(count)count.textContent=shown+' de '+cards.length+' libros físicos';}
function monthlyPlanKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function addBookToMonthlyPlan(id){const b=bookBy(id);if(!b)return;const key=monthlyPlanKey();state.monthlyPlan=state.monthlyPlan&&typeof state.monthlyPlan==='object'?state.monthlyPlan:{};const plan=state.monthlyPlan[key]||{goal:5,bookIds:[]};plan.bookIds=Array.isArray(plan.bookIds)?plan.bookIds:[];if(!plan.bookIds.includes(id))plan.bookIds.push(id);plan.goal=Math.max(Number(plan.goal)||5,plan.bookIds.length);state.monthlyPlan[key]=plan;save();closeModal();render();toast('Añadido al plan de lectura del mes 📚')}

function reviveBookForMonthlyPlan(id){const b=bookBy(id);if(!b||b.status!=='tumba')return;const key=monthlyPlanKey();state.monthlyPlan=state.monthlyPlan&&typeof state.monthlyPlan==='object'?state.monthlyPlan:{};const plan=state.monthlyPlan[key]||{goal:5,bookIds:[]};plan.bookIds=Array.isArray(plan.bookIds)?plan.bookIds:[];if(!plan.bookIds.includes(id))plan.bookIds.push(id);plan.goal=Math.max(Number(plan.goal)||5,plan.bookIds.length);state.monthlyPlan[key]=plan;b.status='tbr';b.revivedAt=new Date().toISOString().slice(0,10);save();closeModal();shelfPanel='tbr';render();toast('Libro revivido y añadido al plan mensual. Está en tu TBR hasta que empieces a leerlo 📚')}
function setShelfBookStatus(id,status){const b=bookBy(id);if(!b)return;const wasPaused=b.status==='pausado';b.status=status;if(status==='actual'&&!b.startedAt)b.startedAt=new Date().toISOString().slice(0,10);if(status==='tbr'||status==='proximo')b.finishedAt='';if(status==='tumba')b.graveyardAt=new Date().toISOString().slice(0,10);save();closeModal();shelfPanel=status==='tbr'||status==='proximo'?'tbr':status==='pausado'?'pausados':status==='tumba'?'tumba':'librero';render();toast(status==='actual'?(wasPaused?'Lectura retomada 📖':'Libro revivido: vuelve a lectura actual 📖'):status==='tumba'?'Libro abandonado y enviado a la tumba de libros 🕯️':'Estado actualizado: '+({tbr:'Mi TBR',proximo:'Mi TBR',pausado:'Pausados'}[status]||status))}
function shelfItems(books){books=books.filter(b=>(b.format||'Físico')==='Físico'&&b.acquisition!=='Me lo prestaron'&&b.owned!==false);return books.length?books.map(b=>{let action=b.status==='pausado'?`<button class="btn secondary" onclick="resumeBook('${b.id}')">Retomar lectura</button><button class="btn outline" onclick="moveToGraveyard('${b.id}')">Abandonar</button>`:b.status==='tumba'?`<button class="btn secondary" onclick="reviveBook('${b.id}')">Revivir</button>`:(['terminado','terminada','read','done','finished','completed','completado','completada'].includes(String(b.status||'').toLowerCase())?`<button class="btn secondary" onclick="rereadBook('${b.id}')">Releer</button>`:'');return `<div class="card bookrow ${b.status==='tumba'?'graveyard-book':''}">${cover(b)}<div><h4>${esc(b.title)}</h4><p>${esc(b.author||'Autor sin registrar')}</p><p>${esc(b.status==='tumba'?'Tumba de los libros':b.status)}${b.rating?` · ${b.rating}★`:''}</p>${(b.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><button class="iconbtn" onclick="openBook('${b.id}')">›</button>${action}${b.status==='terminado'?`<button class="btn outline" onclick="moveBookToShelf('${b.id}')">Entrepaño</button>`:''}</div>`}).join(''):empty('No hay libros físicos en esta sección.')}function dragShelfBook(e,id){e.dataTransfer.setData('text/plain',id)}function dropOnShelf(e,index){e.preventDefault();let b=bookBy(e.dataTransfer.getData('text/plain'));if(!b)return;b.shelfIndex=index;save();render();toast('Libro colocado en la balda '+(index+1))}

r el trato con personas malvadas, pues esas personas son centros de infección astral.","location":"p. 56","createdAt":1718993637720,"favorite":true},{"noteId":"1718996768049666","bookmoryId":"1718928402805305","bookTitle":"MEDICINA OCULTA y MAGIA PRACTICA","author":"Samael Aun Weor","quote":"\"Si una mujer deja a su marido, no se halla entonces libre de él, ni el de ella, pues una unión marital, una vez establecida, pertenece para toda la eternidad\".","location":"p. 57","createdAt":1718996685508,"favorite":true},{"noteId":"1718996962322411","bookmoryId":"1718928402805305","bookTitle":"MEDICINA OCULTA y MAGIA PRACTICA","author":"Samael Aun Weor","quote":"Al abandonar el alma el cuerpo físico por causa de la muerte, se lleva todos sus valores de conciencia. Al reencarnar en un nuevo cuerpo físico trae todos estos valores de conciencia, tanto buenos como malos. Estos valores son energías positivas y negativas.","location":"p. 57","createdAt":1718996849961,"favorite":true},{"noteId":"1718997037096444","bookmoryId":"1718928402805305","bookTitle":"MEDICINA OCULTA y MAGIA PRACTICA","author":"Samael Aun Weor","quote":"Los valores positivos traen salud y dicha. Los valores negativos se materializan en enfermedades y amarguras.","location":"p. 57","createdAt":1718996985462,"favorite":true},{"noteId":"1718997107158409","bookmoryId":"1718928402805305","bookTitle":"MEDICINA OCULTA y MAGIA PRACTICA","author":"Samael Aun Weor","quote":"Cada defecto humano, es pues, un veneno para el organismo.","location":"p. 58","createdAt":1718997076112,"favorite":true},{"noteId":"1719070617475856","bookmoryId":"1718928402805305","bookTitle":"MEDICINA OCULTA y MAGIA PRACTICA","author":"Samael Aun Weor","quote":"Las vacunas deben proscribir se en todos los casos, pues dañan el cuerpo astral de las personas.","location":"p. 69","createdAt":1719070562163,"favorite":true},{"noteId":"1719070815427339","bookmoryId":"1718928402805305","bookTitle":"MEDICINA OCULTA y MAGIA PRACTICA","author":"Samael Aun function syncBookmoryNotesToIdeas(){
 state.quotes=Array.isArray(state.quotes)?state.quotes:[];
 const clean=v=>String(v??'').trim();
 const add=(raw,b=null)=>{
  const obj=typeof raw==='string'?{text:raw}:raw||{};
  const text=clean(obj.quote||obj.text||obj.content||obj.note||obj.body||obj.value);
  if(!text)return;
  const bookId=obj.bookId||obj.book_id||(b&&b.id)||'';
  const noteId=clean(obj.bookmoryNoteId||obj.noteId||obj.note_id||obj.id||'');
  const exists=state.quotes.some(q=>clean(q.quote||q.text)===text&&((bookId&&String(q.bookId||'')===String(bookId))||(noteId&&String(q.bookmoryNoteId||q.noteId||'')===noteId)));
  if(exists)return;
  state.quotes.push({id:noteId?'bm-'+noteId:'note-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),bookmoryNoteId:noteId,bookmoryId:clean(obj.bookmoryId||obj.bid||''),quote:text,bookId,location:clean(obj.location||obj.page&&('p. '+obj.page)||obj.chapter||''),createdAt:obj.createdAt||obj.created_at||obj.date||new Date().toISOString(),date:obj.date||'',favorite:!!(obj.favorite||obj.like),source:'Bookmory'});
 };
 for(const b of (state.books||[])){
  for(const n of (Array.isArray(b.notes)?b.notes:[]))add(n,b);
  if(Array.isArray(b.bookmoryNotes))for(const n of b.bookmoryNotes)add(n,b);
 }
 for(const n of (Array.isArray(state.bookmoryNotes)?state.bookmoryNotes:[])){
  const b=(state.books||[]).find(x=>String(x.bookmoryId||'')===String(n.bookmoryId||n.bid||''))||null;add(n,b);
 }
 for(const n of BOOKMORY_EXPORTED_NOTES){
  const b=(state.books||[]).find(x=>String(x.bookmoryId||'')===String(n.bookmoryId||''))||
    (state.books||[]).find(x=>(x.title||'').trim().toLowerCase()===(n.bookTitle||'').trim().toLowerCase()&&(!n.author||!x.author||String(x.author).toLowerCase().includes(String(n.author).toLowerCase())))||null;
  const text=clean(n.quote); if(!text)continue;
  const already=state.quotes.some(q=>(String(q.bookmoryNoteId||'')===String(n.noteId))||
    (clean(q.quote||q.text)===text && ((b&&String(q.bookId||'')===String(b.id))||(!b&&String(q.bookmoryId||'')===String(n.bookmoryId)))));
  if(already)continue;
  state.quotes.push({id:'bm-export-'+n.noteId,bookmoryNoteId:String(n.noteId),bookmoryId:String(n.bookmoryId),quote:text,bookId:b?b.id:'',location:n.location||'',createdAt:n.createdAt?new Date(Number(n.createdAt)).toISOString():new Date().toISOString(),favorite:!!n.favorite,source:'Bookmory',noteType:'nota'});
 }
}
function noteCover(q){let b=bookBy(q.bookId);return b?cover(b,true):`<div class="cover note-cover-placeholder"><span>Entre Páginas</span></div>`}
function noteCard(q,extra=''){let b=bookBy(q.bookId)||{};let text=q.quote||q.text||'';let date=q.createdAt?new Date(q.createdAt).toLocaleString('es-CO',{day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';return `<article class="note-book-card ${extra}" data-note-id="${esc(q.id)}"><div class="note-book-head"><div class="note-cover-wrap">${noteCover(q)}</div><div class="note-book-meta"><b>${esc(b.title||q.bookTitle||'Nota personal')}</b><span>${esc(b.author||q.author||'')}</span></div><span class="note-type-label">${esc(q.noteType||'Cita del libro')}</span></div><div class="note-date-line">${esc(date)} ${q.location?`<span>${esc(q.location)}</span>`:''}</div><div class="note-book-quote">${esc(text)}</div><div class="note-actions"><button title="Marcar como leída" aria-label="Marcar como leída" onclick="markQuoteRead('${q.id}')">✓</button><button class="${q.favorite?'is-favorite':''}" title="${q.favorite?'Quitar de favoritas':'Añadir a favoritas'}" aria-label="Favorita" onclick="toggleQuoteFavorite('${q.id}')">♥</button><button title="Copiar nota" aria-label="Copiar nota" onclick="copyQuote('${q.id}')">▢</button><button title="Notas sobre esta nota" aria-label="Comentar nota" onclick="commentQuote('${q.id}')">☏</button><span class="note-action-spacer"></span><button class="note-download" title="Descargar nota" aria-label="Descargar nota" onclick="downloadQuote('${q.id}')">⇩</button><button title="Más opciones" aria-label="Más opciones" onclick="quoteOptions('${q.id}')">⋮</button></div></article>`}
function randomReader(q,all){if(!q)return empty('Todavía no hay notas para descubrir.');let index=all.findIndex(x=>x.id===q.id);return `<div class="random-reader" ontouchstart="noteSwipeStart(event)" ontouchend="noteSwipeEnd(event)" onpointerdown="notePointerStart(event)" onpointerup="notePointerEnd(event)"><div class="reader-stack"><div class="reader-paper-back back-two"></div><div class="reader-paper-back back-one"></div>${noteCard(q,'reader-note-card')}</div><div class="reader-controls"><button class="reader-heart ${q.favorite?'is-favorite':''}" onclick="toggleQuoteFavorite('${q.id}')" aria-label="Favorita">♥</button><button onclick="downloadQuote('${q.id}')" aria-label="Descargar nota">⇩</button><button onclick="editQuote('${q.id}')" aria-label="Editar nota">✎</button><button class="reader-next" onclick="nextRandomNote(1)" aria-label="Siguiente nota">✓</button></div><p class="reader-hint">Desliza a la izquierda o derecha para cambiar de página · ${index+1} de ${all.length}</p></div>`}
function ideas(){syncBookmoryNotesToIdeas();save();let ordered=state.quotes.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));let favorites=ordered.filter(q=>q.favorite);let cited=ordered.filter(q=>q.bookId);let randomList=window.randomQuoteOrder?.map(id=>ordered.find(q=>q.id===id)).filter(Boolean)||[];if(window.ideasPanel==='random'&&(!randomList.length||randomList.length!==ordered.length)){randomList=shuffleNotes(ordered);window.randomQuoteOrder=randomList.map(q=>q.id)}let panel=window.ideasPanel==='favorites'?favorites:window.ideasPanel==='books'?cited:ordered;let panelTitle=window.ideasPanel==='favorites'?'Notas favoritas':window.ideasPanel==='books'?'Libros citados':'Notas';let currentRandom=randomList[Math.max(0,Number(window.randomNoteIndex)||0)%Math.max(1,randomList.length)];let reader=window.ideasPanel==='random';return `${reader?`<div class="notes-subhead"><button class="notes-back" onclick="setIdeasPanel('all')" aria-label="Volver">←</button><div><h2>Notas aleatorias</h2><p>${ordered.length} notas guardadas</p></div><button class="notes-search" onclick="randomizeNotes()" aria-label="Mezclar notas">⤨</button></div>${randomReader(currentRandom,randomList)}`:`<div class="notes-heading"><h2 class="page-title">${window.ideasPanel==='all'?'Entre Páginas':panelTitle}</h2><p class="muted notes-count-subtitle">${ordered.length} notas guardadas</p></div><div class="note-shortcuts notes-navigation"><button class="note-tile" onclick="setIdeasPanel('favorites')"><span class="note-tile-icon heart-icon">♥</span><b>Notas favoritas</b><span class="muted small">${favorites.length} notas</span></button><button class="note-tile" onclick="setIdeasPanel('random')"><span class="note-tile-icon">⤨</span><b>Leer aleatoriamente</b><span class="muted small">Pasar páginas</span></button><button class="note-tile" onclick="setIdeasPanel('books')"><span class="note-tile-icon">▤</span><b>Libros citados</b><span class="muted small">${cited.length} notas</span></button></div><div class="section-head"><h3>${panelTitle}</h3><span class="pill">${panel.length}</span></div><div class="note-book-list">${panel.length?panel.map(q=>noteCard(q)).join(''):empty(window.ideasPanel==='favorites'?'Marca con el corazón las notas que quieras guardar como favoritas.':window.ideasPanel==='books'?'Todavía no hay notas vinculadas a libros.':'Todavía no hay notas guardadas.')}</div>`}`}

function shuffleNotes(a){let out=a.slice();for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function setIdeasPanel(mode){syncBookmoryNotesToIdeas();window.ideasPanel=mode;if(mode==='random'){window.randomQuoteOrder=shuffleNotes(state.quotes.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))).map(q=>q.id);window.randomNoteIndex=0}render()}
function randomizeNotes(){syncBookmoryNotesToIdeas();window.randomQuoteOrder=shuffleNotes(state.quotes.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))).map(q=>q.id);window.randomNoteIndex=0;window.ideasPanel='random';render()}
function nextRandomNote(dir=1){let ids=window.randomQuoteOrder||[];if(!ids.length)return;window.randomNoteIndex=(Number(window.randomNoteIndex||0)+dir+ids.length)%ids.length;render()}
function noteSwipeStart(e){window.noteTouchX=e.changedTouches?.[0]?.clientX||0;window.noteTouchY=e.changedTouches?.[0]?.clientY||0}
function noteSwipeEnd(e){let x=e.changedTouches?.[0]?.clientX||0,y=e.changedTouches?.[0]?.clientY||0,dx=x-(window.noteTouchX||0),dy=y-(window.noteTouchY||0);if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))nextRandomNote(dx>0?1:-1)}
function notePointerStart(e){if(e.pointerType==='mouse')window.noteMouseX=e.clientX}
function notePointerEnd(e){if(e.pointerType==='mouse'&&window.noteMouseX!=null){let dx=e.clientX-window.noteMouseX;window.noteMouseX=null;if(Math.abs(dx)>70)nextRandomNote(dx>0?1:-1)}}
function markQuoteRead(id){let q=state.quotes.find(x=>String(x.id)===String(id));if(!q)return;q.read=true;save();toast('Nota marcada 🤎')}
function copyQuote(id){let q=state.quotes.find(x=>String(x.id)===String(id));if(!q)return;let text=q.quote||q.text||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Nota copiada')).catch(()=>toast(text));else toast(text)}
function downloadQuote(id){let q=state.quotes.find(x=>String(x.id)===String(id));if(!q)return;window.quoteImageDraftId=id;window.quoteImageStyle=window.quoteImageStyle||{mode:'solid',color:'#000000',preset:'chalk'};const st=window.quoteImageStyle;modal(`<div class="modalhead"><div><h3>Crear imagen de tu nota</h3><p class="muted small">Personaliza el fondo y guarda tu cita como imagen.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="quote-export-preview" id="quoteExportPreview"><div class="quote-export-preview-text">“${esc(q.quote||q.text||'')}”</div><div class="quote-export-preview-meta">${esc(q.bookTitle||bookBy(q.bookId)?.title||'Entre Páginas')}<br>${esc(q.author||bookBy(q.bookId)?.author||'')}${q.location?'<br>'+esc(q.location):''}</div></div><div class="quote-export-tabs"><button class="btn secondary" onclick="setQuoteImageMode('solid')">Color sólido</button><button class="btn secondary" onclick="setQuoteImageMode('gradient')">Degradado</button><button class="btn secondary" onclick="setQuoteImageMode('image')">Fondos predeterminados</button></div><div id="quoteExportOptions"></div><div class="form-actions"><button class="btn" onclick="generateQuoteImage('${id}')">Descargar imagen PNG</button></div>`);document.querySelector('#modalroot .modalback')?.classList.add('quote-export-modal');renderQuoteImageOptions();updateQuoteExportPreview()}
function setQuoteImageMode(mode){window.quoteImageStyle=window.quoteImageStyle||{};window.quoteImageStyle.mode=mode;renderQuoteImageOptions();updateQuoteExportPreview()}
function renderQuoteImageOptions(){const s=window.quoteImageStyle||{};const root=document.getElementById('quoteExportOptions');if(!root)return;if(s.mode==='solid'){root.innerHTML=`<div class="quote-color-row"><label for="quoteExportColor">Elige el color del fondo</label><input id="quoteExportColor" type="color" value="${s.color||'#000000'}" oninput="window.quoteImageStyle.color=this.value;updateQuoteExportPreview()"><span>${s.color||'#000000'}</span></div><div class="quote-color-swatches">${['#000000','#F6F0E6','#FFFFFF','#EF3D96','#9DBBD0','#E7D18A','#DDEB80','#263238'].map(c=>`<button style="background:${c}" aria-label="Color ${c}" onclick="window.quoteImageStyle.color='${c}';document.getElementById('quoteExportColor').value='${c}';updateQuoteExportPreview()"></button>`).join('')}</div>`}else if(s.mode==='gradient'){root.innerHTML=`<div class="quote-preset-grid">${[['night','Noche','#101318','#343B48'],['coffee','Café','#3E281F','#B78B67'],['rose','Rosa','#F7C7D9','#B85D7C'],['sage','Salvia','#DCE4D4','#75866B'],['ocean','Océano','#0B2734','#4C7D8A'],['sunset','Atardecer','#F4B183','#9B537B']].map(x=>`<button class="quote-preset ${s.preset===x[0]?'selected':''}" onclick="window.quoteImageStyle.preset='${x[0]}';updateQuoteExportPreview()" style="background:linear-gradient(135deg,${x[2]},${x[3]})">${x[1]}</button>`).join('')}</div>`}else{const photos=[['moon','Luna y cielo','https://images.unsplash.com/photo-1532693322450-2cb5c511067d?auto=format&fit=crop&w=900&q=85'],['mountain','Montañas','https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85'],['ocean','Mar tranquilo','https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=85'],['sunset','Atardecer','https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=85'],['forest','Bosque','https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=85'],['flowers','Flores','https://image function generateQuoteImage(id){const q=state.quotes.find(x=>String(x.id)===String(id));if(!q)return;const b=bookBy(q.bookId)||{},s=window.quoteImageStyle||{mode:'solid',color:'#000000'};const W=1080,H=1350,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');let fg='#fff';function gradient(a,b){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,a);g.addColorStop(1,b);return g}function drawText(){ctx.fillStyle=fg;ctx.textAlign='left';ctx.textBaseline='top';const margin=86;ctx.globalAlpha=.78;ctx.font='600 22px Arial';ctx.fillText('ENTRE PÁGINAS',margin,76);ctx.globalAlpha=1;ctx.strokeStyle=fg;ctx.globalAlpha=.35;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(margin,126);ctx.lineTo(W-margin,126);ctx.stroke();ctx.globalAlpha=1;let quote='“'+(q.quote||q.text||'')+'”';let fontSize=34;ctx.font=fontSize+'px Georgia, serif';const maxWidth=W-margin*2,lineHeight=49;let words=quote.split(/\s+/),lines=[],line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);while(lines.length*lineHeight>H*.48&&fontSize>24){fontSize-=2;ctx.font=fontSize+'px Georgia, serif';lines=[];line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line)}let y=Math.max(230,(H-lines.length*lineHeight)/2-45);for(const l of lines){ctx.fillText(l,margin,y);y+=lineHeight}y=Math.min(H-250,y+48);ctx.globalAlpha=.9;ctx.font='italic 24px Georgia, serif';const bookTitle=b.title||q.bookTitle||'Nota personal';ctx.fillText(bookTitle,margin,y);y+=36;ctx.font='21px Arial';const author=b.author||q.author||'';if(author){ctx.fillText(author,margin,y);y+=31}if(q.location){ctx.fillText(q.location,margin,y);y+=31}ctx.globalAlpha=.72;ctx.font='18px Arial';ctx.fillText('Mi biblioteca personal',margin,H-90);ctx.globalAlpha=1}functi function autoReaderChallenges(){let books=finished(),out=[];const add=(i,yes)=>{if(yes)out.push(i)};for(const b of books){let title=String(b.title||'').toLowerCase(),pages=Number(b.pages)||0,year=Number(b.publishedYear||b.publicationYear||b.year)||0,genres=(b.genres||[]).join(' ').toLowerCase(),langs=String(b.language||b.languages||'').toLowerCase();add(0,pages>0&&pages<200);add(4,/(rojo|roja|rojos|rojas|negro|negra|negros|negras|blanco|blanca|blancos|blancas|azul|azules|verde|verdes|amarillo|amarilla|rosa|violeta|gris|morado|marrón|dorado)/i.test(title));add(7,!!b.seriesName&&(/1|primero|first/i.test(String(b.seriesPosition||b.seriesNumber||''))||Number(b.seriesPosition||b.seriesNumber)===1));add(9,year>0&&year<2000);add(10,/(cuento|cuentos|relato|relatos|antolog[ií]a)/i.test(genres+' '+title));add(13,year>0&&year<2000);add(16,!!langs&&!/(español|spanish|castellano|es)$/i.test(langs));add(17,title.trim().split(/\s+/).filter(Boolean).length===1)}return [...new Set(out)]}
function booksForChallenge(i){let books=finished();const norm=x=>String(x||'').toLowerCase();return books.filter(b=>{let title=norm(b.title),pages=Number(b.pages)||0,year=Number(b.publishedYear||b.publicationYear||b.year)||0,genres=norm((b.genres||[]).join(' ')),langs=norm(b.language||b.languages);switch(i){case 0:return pages>0&&pages<200;case 1:return (state.tbr||[]).some(x=>x.id===b.id)||(state.books||[]).some(x=>x.id===b.id&&['tbr','proximo'].includes(x.status));case 2:return !!(b.genres&&b.genres.length);case 3:return !!b.author;case 4:return /(rojo|roja|negro|negra|blanco|blanca|azul|verde|amarillo|rosa|violeta|gris|morado|marrón|dorado)/i.test(title);case 5:return !!(b.coverUrl||b.thumbnail);case 6:return !!b.adaptation||/(pel[ií]cula|serie|film|movie)/i.test(norm(b.notes));case 7:return !!b.seriesName&&Number(b.seriesPosition||b.seriesNumber||1)===1;case 8:return !!b.seriesName&&Number(b.seriesPosition||b.seriesNumber||0)>1;case 9:return year>0&&year<2000;case 10:return /(cuento|cuentos|relato|relatos|antolog[ií]a)/i.test(genres+' '+title);case 11:return !!(b.recommendedBy||b.recommendation);case 12:return (state.wishlist||[]).some(x=>norm(x.title)===title);case 13:return year>0&&year<2000;case 14:return !!b.authorGender||!!b.author;case 15:return /(colombia|méxico|mexico|argentina|chile|perú|peru|latino|latina)/i.test(norm(b.authorOrigin||b.authorCountry||b.author));case 16:return !!langs&&!/(español|spanish|castellano|es)$/i.test(langs);case 17:return title.trim().split(/\s+/).filter(Boolean).length===1;case 18:return !!(b.startedAt||b.status==='pausado'||b.status==='leyendo');case 19:return !!(b.acquisition&&/prest|regal|gratis/i.test(b.acquisition));default:return false}})}
function challengeBookResult(i){let books=booksForChallenge(i);return `<div class="challenge-book-result"><b>Libro asociado a este reto</b>${books.length?books.map(b=>`<div style="display:flex;gap:10px;align-items:center;margin-top:10px"><div style="width:58px;flex:0 0 58px">${cover(b)}</div><div><b>${esc(b.title)}</b><p class="muted small" style="margin:4px 0">${esc(b.author||'')} ${b.rating?'· '+b.rating+'★':''}</p><button class="btn secondary" onclick="event.stopPropagation();openBook('${b.id}')">Ver libro</button></div></div>`).join(''):'<p class="muted small">El reto aparece cumplido, pero no hay un libro que pueda vincular con certeza usando los datos disponibles.</p>'}</div>`}
function showChallengeBooks(i){window.challengeSelected=window.challengeSelected===i?null:i;render()}
function challenges(){let year=new Date().getFullYear(),n=finished().filter(b=>(b.finishedAt||'').startsWith(String(year))).length;let custom=(state.challenges||[]).map(c=>{let progress=challengeProgress(c);return `<div class="card"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px"><div><h3 style="font-family:Georgia,serif;margin:0 0 6px">${esc(c.title)}</h3><p class="muted small">${esc(c.description||'Reto personal')} ${c.genre?'· '+esc(c.genre):''}</p></div><button class="iconbtn" onclick="deleteChallenge('${c.id}')" aria-label="Eliminar reto">×</button></div><div class="progress"><span style="width:${Math.min(100,progress/Math.max(1,Number(c.target))*100)}%"></span></div><span class="small muted">${progress} de ${c.target}${c.type==='minutes'?' minutos':c.type==='pages'?' páginas':' libros'}${c.due?' · Hasta '+esc(c.due):''}</span></div>`}).join('');let done=autoReaderChallenges();let presetCards=DEFAULT_READER_CHALLENGES.map((c,i)=>`<div class="card" style="padding:14px;display:flex;gap:12px;align-items:flex-start;${done.includes(i)?'border-color:var(--sage,#b8c4aa);background:var(--sage-light,#edf0e8);cursor:pointer;':''}" ${done.includes(i)?`onclick="showChallengeBooks(${i})"`:''}><div style="width:24px;flex:0 0 24px;font-size:21px;color:#6f8064;text-align:center">${done.includes(i)?'✓':'○'}</div><div style="flex:1"><h3 style="font-family:Georgia,serif;margin:0 0 5px;font-size:17px">${esc(c.title)}</h3><p class="muted small" style="margin:0">${esc(c.description)}</p>${done.includes(i)?'<p class="small" style="margin:8px 0 0">Toca para ver el libro con el que cumpliste ↗</p>':''}${window.challengeSelected===i?challengeBookResult(i):''}</div></div>`).join('');return `<h2 class="page-title">Retos lectores</h2><div class="card" style="margin-top:16px"><h3 style="font-family:Georgia,serif;margin:0">Mi reto anual</h3><div style="font-family:Georgia,serif;font-size:36px;margin-top:12px">${n} <span class="muted" style="font-size:17px">de ${state.goal} libros</span></div><div class="progress"><span style="width:${Math.min(100,n/(Number(state.goal)||24)*100)}%"></span></div><div class="muted small">${Math.max(0,state.goal-n)} libros para completar tu meta.</div></div><div class="section-head" style="margin-top:22px"><h3>Mis retos lectores</h3><span class="pill">${done.length} de ${DEFAULT_READER_CHALLENGES.length}</span></div><div class="booklist">${presetCards}</div>${section('Mis retos personales')}<div class="booklist">${custom||empty('Todavía no hay retos personales. Puedes crearlos desde Ajustes.')}</div>`}
function challengeProgress(c){let books=finished();if(c.type==='books')return books.filter(b=>!c.due||!b.finishedAt||b.finishedAt<=c.due).filter(b=>!c.genre||(b.genres||[]).some(g=>g.toLowerCase().includes(c.genre.toLowerCase()))).length;if(c.type==='genre')return books.filter(b=>(b.genres||[]).some(g=>(c.genre||'').toLowerCase()&&g.toLowerCase().includes(c.genre.toLowerCase()))).length;if(c.type==='minutes')return (state.sessions||[]).reduce((n,x)=>n+(Number(x.minutes)||0),0);if(c.type==='pages')return (state.sessions||[]).reduce((n,x)=>n+(Number(x.pagesRead)||0),0);return 0}
function createChallenge(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());state.challenges=state.challenges||[];state.challenges.push({id:String(Date.now()),title:d.title.trim(),description:d.description.trim(),type:d.type,target:Number(d.target)||1,genre:d.genre.trim(),due:d.due||''});save();render();toast('¡Reto creado! Ya aparece en Retos lectores 🎯')}
function deleteChallenge(id){if(!confirm('¿Eliminar este reto?'))return;state.challenges=(state.challenges||[]).filter(c=>c.id!==id);save();render()}
function financeSettingsSummary(){const books=(state.books||[]).filter(b=>['Lo compré','Compra'].includes(String(b.acquisition||'').trim()));const now=new Date(),monthKey=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`,yearKey=String(now.getFullYear());const dateOf=b=>String(b.purchaseDate||b.createdAt||'').slice(0,10);const amount=b=>Math.max(0,Number(String(b.price??'').replace(/[^0-9.,-]/g,'').replace(/,(?=\d{3}(?:\D|$))/g,'').replace(',','.'))||0);const month=books.filter(b=>dateOf(b).startsWith(monthKey)),year=books.filter(b=>dateOf(b).startsWith(yearKey));const total=a=>a.reduce((sum,b)=>sum+amount(b),0);const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);const countLabel=n=>`${n} ${n===1?'libro':'libros'}`;const card=(label,items)=>`<div class="finance-summary-item"><small>${label}</small><strong class="finance-book-count">${items.length}</strong><span class="finance-count-label">${items.length===1?'libro comprado':'libros comprados'}</span><div class="finance-money-caption">${money(total(items))}</div><span class="finance-count-caption">${items.length===1?'Valor de 1 libro registrado.':items.length>1?'Valor total de '+items.length+' libros registrados.':'Aún no hay compras registradas en este periodo.'}</span></div>`;return `<div class="finance-summary-grid">${card('Este mes',month)}${card('Este año',year)}${card('Inversión registrada',books)}</div>${books.length?`<div class="finance-purchase-list"><p class="muted small finance-list-heading">Detalle de compras · cada fila corresponde a un libro</p>${books.slice().sort((a,b)=>dateOf(b).localeCompare(dateOf(a))).slice(0,12).map(b=>`<div class="finance-purchase-row"><span>${esc(b.title||'Libro sin título')}<small>${dateOf(b)||'Fecha sin registrar'} · 1 libro</small></span><b>${money(amount(b))}</b></div>`).join('')}${books.length>12?`<p class="muted small">Se muestran las 12 compras más recientes de ${books.length} libros registrados.</p>`:''}</div>`:'<p class="muted small">Todavía no hay compras registradas. Cuando agregues un libro, marca “Compra” e indica el precio y la fecha para que aparezca aquí.</p>'}`}

function genreFromCatalog(categories,title='',author=''){
 const raw=(Array.isArray(categories)?categories.map(x=>typeof x==='string'?x:(x?.name||'')).join(' '):String(categories||'')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const nt=String(title||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const na=String(author||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 // Match specific genres before broad/overlapping terms; generic "fiction" is not enough.
 const rules=[['Gótico',['gothic fiction','gothic novel','gothic literature','gothic']],['Terror',['horror fiction','horror stories','horror','terror','ghost stories','supernatural fiction']],['Thriller',['psychological thriller','crime thriller','thriller','suspense','suspenso']],['Misterio',['mystery fiction','detective fiction','mystery','detective','crime fiction','crime']],['Romance',['romance fiction','love stories','romance']],['Fantasía',['fantasy fiction','fantasy','magic']],['Ciencia ficción',['science fiction','sci-fi','science fiction']],['Distopía',['dystopian','dystopia']],['Histórica',['historical fiction','historical novel','historical']],['Clásicos',['classic literature','classics','classic']],['Poesía',['poetry']],['Filosofía',['philosophy']],['Psicología',['psychology']],['Autoayuda',['self-help','self help']],['Biografía',['biography','memoir']],['Juvenil',['young adult','juvenile fiction']],['Contemporánea',['contemporary fiction']]];
 for(const [g,terms] of rules)if(terms.some(t=>raw.includes(t)))return g;
 // Fallbacks for well-established works when catalog subjects are too broad.
 if(/metamorfosis|the metamorphosis/.test(nt)&&/kafka/.test(na))return 'Clásicos';
 if(/dracula/.test(nt)&&/bram stoker|stoker/.test(na))return 'Gótico';
 if(/frankenstein/.test(nt)&&/mary shelley|shelley/.test(na))return 'Gótico';
 if(/it|eso|carrie|the shining|el resplandor|pet sematary|cementerio de animales/.test(nt)&&/stephen king|king/.test(na))return 'Terror';
 return '';
}
function catalogTags(categories,title=''){
 const raw=(Array.isArray(categories)?categories.map(x=>typeof x==='string'?x:(x?.name||'')).join(' '):String(categories||''));
 const tags=suggestLiteraryTags(raw,title,'');
 const extras=[];
 const text=raw.toLowerCase();
 const extraRules=[['Vampiros',['vampire','vampires','vampiros']],['Brujas',['witch','witches','brujas','witchcraft']],['Paranormal',['paranormal']],['Sobrenatural',['supernatural']],['Policial',['police procedural','detective fiction']],['Suspenso psicológico',['psychological thriller']],['Cuentos',['short stories','short story']],['Mitología',['mythology','mythological']],['Aventura',['adventure fiction','adventure']],['Familia',['family relationships','family life']],['Amistad',['friendship']],['Duelo',['grief']],['Salud mental',['mental health']]];
 for(const [tag,terms] of extraRules)if(terms.some(t=>text.includes(t)))extras.push(tag);
 const subjectTags=[];const subjectRules=[['Insectos',['insect','insects','insectos']],['Transformación',['transformation','metamorphosis','transformación']],['Alienación',['alienation','alienación']],['Familia',['family','familia']],['Vampiros',['vampire','vampires','vampiros']],['Brujas',['witch','witches','brujas','witchcraft']],['Amor oscuro',['dark romance']],['Crimen',['crime','criminal']],['Investigación',['investigation','detective']],['Secretos',['secrets','secretos']],['Casa encantada',['haunted house']],['Demonios',['demon','demons','demonios']]];
 for(const [tag,terms] of subjectRules)if(terms.some(t=>text.includes(t)))subjectTags.push(tag);
 return [...new Set([...tags,...extras,...subjectTags])].filter(t=>!['Clásicos'].includes(t)||/classic/i.test(raw)).slice(0,10);
}

async function getCatalogMetadataForBook(book){
 const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
 const title=String(book.title||'').trim(),author=String(book.author||'').trim(),targetTitle=norm(title),targetAuthor=norm(author);let buckets=[];
 const matches=(x)=>{const xt=norm(x.title);const authors=x.authors||x.author_name||[];const authorOk=!targetAuthor||authors.some(a=>{const an=norm(typeof a==='string'?a:a?.name);return an&&(an.includes(targetAuthor)||targetAuthor.includes(an))});return xt===targetTitle&&authorOk};
 try{const q='intitle:"'+title+'"'+(author?' inauthor:"'+author+'"':'');const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=10&printType=books');if(r.ok){const d=await r.json(),items=d.items||[];const hit=items.find(x=>matches({...x.volumeInfo,authors:x.volumeInfo?.authors}))||items.find(x=>norm(x.volumeInfo?.title)===targetTitle);if(hit?.volumeInfo){const v=hit.volumeInfo;buckets.push(...(v.categories||[]));if(v.description)buckets.push(v.description)}}}catch(e){}
 try{const url='https://openlibrary.org/search.json?title='+encodeURIComponent(title)+(author?'&author='+encodeURIComponent(author):'')+'&limit=10&fields=title,author_name,subject';const r=await fetch(url);if(r.ok){const d=await r.json(),docs=d.docs||[];const hit=docs.find(matches)||docs.find(x=>norm(x.title)===targetTitle);if(hit)buckets.push(...(hit.subject||[]))}}catch(e){}
 return buckets;
}

 let updated=0,tagged=0,notFound=0,failed=0;
 for(let i=0;i<books.length;i++){const b=books[i];if(progress)progress.textContent=`Revisando géneros y etiquetas: ${i+1} de ${books.length} · ${b.title||'Libro sin título'}`;

   if(genre){if(b.genre!==genre||(b.genres||[]).join('|')!==genre){b.genre=genre;b.genres=[genre];changed=true}b.genreSource='Google Books / Open Library';b.genreUpdatedAt=new Date().toISOString();updated++}else notFound++;

  }catch(e){failed++}

function suggestLiteraryTags(categories,title='',author=''){

 for(const [tag,terms] of rules)if(terms.some(t=>txt.includes(t))&&!tags.includes(tag))tags.push(tag);

async function lookupISBN(isbn){

    const gr=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent('isbn:'+isbn)+'&maxResults=10&printType=books');
    if(gr.ok){
      const gd=await gr.json();
      const item=(gd.items||[]).find(x=>x.volumeInfo);
      if(item){
        const v=item.volumeInfo||{},imgs=v.imageLinks||{};
        set('isbn',isbn);set('title',v.title);set('author',(v.authors||[]).join(', '));set('publisher',v.publisher);set('pages',v.pageCount);

        set('synopsis',v.description?String(v.description).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim():'');
        set('coverUrl',(imgs.extraLarge||imgs.large||imgs.medium||imgs.thumbnail||imgs.smallThumbnail||'').replace(/^http:/,'https:'));
        const subjects=(v.categories||[]).join(' ').toLowerCase();
        const gm=[['Gótico',['gothic','gótico']],['Terror',['horror','terror']],['Romance',['romance']],['Fantasía',['fantasy','fantasía']],['Misterio',['mystery','misterio']],['Clásicos',['classic','clásico']],['Ciencia ficción',['science fiction','ciencia ficción']],['Histórica',['historical','histórica']],['Thriller',['thriller']],['Contemporánea',['contemporary','contemporánea']],['Poesía',['poetry','poesía']],['No ficción',['nonfiction','non-fiction','no ficción']]];
        const g=gm.find(([name,terms])=>terms.some(t=>subjects.includes(t)));if(g)set('genre',g[0]);found=true;
      }
    }
  }catch(e){}
  if(!found){
    try{
      const r=await fetch('https://openlibrary.org/api/books?bibkeys=ISBN:'+encodeURIComponent(isbn)+'&format=json&jscmd=data');
      if(r.ok){const data=await r.json(),b=data['ISBN:'+isbn];if(b){set('isbn',isbn);set('title',b.title);set('author',(b.authors||[]).map(a=>a.name).join(', '));set('publisher',(b.publishers||[]).map(a=>a.name).join(', '));set('pages',b.number_of_pages);set('language',(b.languages||[]).map(a=>a.key?.split('/').pop()).join(', '));set('synopsis',typeof b.notes==='string'?b.notes:(b.excerpts||[]).map(x=>x.text).join(' '));set('coverUrl',b.cover?.large||b.cover?.medium||b.cover?.small||'');found=true;}}
    }catch(e){}
  }
  if(status)status.textContent=found?'¡Libro encontrado! Revisa los datos y completa lo que falte antes de guardarlo.':'No encontramos ese ISBN en los catálogos. Comprueba el número o completa los datos manualmente.';
  if(found){const t=document.getElementById('bookTitleInput');if(t&&t.value.trim())t.dataset.selectedTitle=t.value.trim();}
}

function editBookMetadata(id){const b=bookBy(id);if(!b)return;const genres=['Gótico','Terror','Romance','Fantasía','Misterio','Clásicos','Ciencia ficción','Histórica','Thriller','Contemporánea','Poesía','No ficción','Otro'];const currentGenre=(b.genres||[])[0]||b.genre||'';const priceValue=Math.max(0,Math.round(Number(String(b.price??'').replace(/[^0-9]/g,''))||0));const acquisition=b.acquisition||'';modal(`<div class="modalhead"><h3>Editar datos del libro</h3><button class="close" onclick="openBook('${id}')">×</button></div><p class="muted small">Corrige los datos de tu ejemplar. El precio se guarda en pesos colombianos (COP).</p><form id="editBookMetadataForm" onsubmit="saveBookMetadata(event,'${id}')"><div class="field"><label>Título</label><input name="title" value="${esc(b.title||'')}" required></div><div class="field"><label>Autor/a</label><input name="author" value="${esc(b.author||'')}"></div><div class="field"><label>Género</label><select name="genre"><option value="">Sin género</option>${genres.map(g=>`<option value="${g}" ${currentGenre===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label>Formato</label><select name="format"><option ${b.format==='Físico'?'selected':''}>Físico</option><option ${b.format==='Ebook'?'selected':''}>Ebook</option><option ${b.format==='Audiolibro'?'selected':''}>Audiolibro</option></select></div><div class="field"><label>ISBN</label><input name="isbn" value="${esc(b.isbn||'')}"></div><div class="field"><label>Editorial</label><input name="publisher" value="${esc(b.publisher||'')}"></div><div class="field"><label>Número de páginas</label><input name="pages" type="number" min="0" value="${Number(b.pages)||''}"></div><div class="field"><label>¿Cómo conseguiste este libro?</label><select name="acquisition"><option value="">Sin indicar</option><option value="Lo compré" ${acquisition==='Lo compré'?'selected':''}>Compra</option><option value="Me lo prestaron" ${acquisition==='Me lo prestaron'?'selected': function saveBookMetadata(e,id){e.preventDefault();const b=bookBy(id);if(!b)return;const d=Object.fromEntries(new FormData(e.target).entries());b.title=(d.title||'').trim();b.author=(d.author||'').trim();b.genres=d.genre?[d.genre]:[];b.genre=d.genre||'';b.format=d.format||b.format;b.isbn=(d.isbn||'').trim();b.publisher=(d.publisher||'').trim();const pages=Math.max(0,Number(d.pages)||0);b.pages=b.format==='Físico'?pages:(Number(b.pages)||0);b.chapters=b.format!=='Físico'?(Number(b.chapters)||0):0;b.acquisition=d.acquisition||'';b.price=d.price!==''&&d.price!=null?Math.max(0,Math.round(Number(String(d.price).replace(/[^0-9]/g,''))||0)):0;b.store=(d.store||'').trim();b.purchaseDate=d.purchaseDate||'';b.synopsis=(d.synopsis||'').trim();b.tags=(d.tags||'').split(',').map(x=>x.trim()).filter(Boolean);save();closeModal();render();toast('Datos del libro actualizados')}
function saveBookDetail(id){let b=bookBy(id);if(!b)return;b.rating=Number(document.getElementById('ratingEdit').value)||0;b.review=document.getElementById('reviewEdit').value;b.characters=document.getElementById('charactersEdit')?.value||'';b.places=document.getElementById('placesEdit')?.value||'';b.summary=document.getElementById('summaryEdit')?.value||'';b.emotions={};['Enamorada','Lloré mucho','Me rompió','Spicy','Terror','Me hizo reír','Plot twist','Rabia'].forEach(em=>b.emotions[em]=Number(document.getElementById('emotion-'+em).value)||0);save();closeModal();render();toast('Ficha actualizada ✨')}
function changeBookStatus(id){let b=bookBy(id);if(!b)return;if(['terminado','terminada','read','done','finished','completed','completado','completada'].includes(String(b.status||'').toLowerCase())){toast('Los libros terminados solo pueden pasar a Lectura actual mediante Releer.');return}if(['tbr','proximo','pausado','tumba'].includes(String(b.status||''))){toast('Usa la acción correspondiente para este estado.');return}toast('Usa las acciones de lectura para cambiar el estado.')}
function saveStatus(id){let b=bookBy(id);if(!b)return;let s=document.getElementById('statusEdit')?.value;if(!s)return;if(['terminado','terminada','read','done','finished','completed','completado','completada'].includes(String(b.status||'').toLowerCase())&&s!=='actual'){toast('Un libro terminado solo puede pasar a Lectura actual para releerlo.');return}if(['tbr','proximo'].includes(String(b.status||''))&&s!=='actual'){toast('Desde el TBR solo puedes empezar a leer.');return}if(b.status==='pausado'&&!['actual','tumba'].includes(s)){toast('Desde Pausados solo puedes retomar o abandonar.');return}if(b.status==='tumba'&&s!=='actual'){toast('Desde la Tumba de libros solo puedes revivir.');return}b.status=s;if(s==='terminado'){b.progress=100;b.finishedAt=new Date().toISOString().slice(0,10)}if(s==='tumba')b.graveyardAt=new Date().toISOString().slice(0,10);save();closeModal();render();toast('Estado actualizado')}
function setQuickStatus(id,s){let b=bookBy(id);if(!b)return;if(s==='actual'&&['tbr','proximo'].includes(String(b.status||'')))return startReading(id);if(s==='actual'&&b.status==='pausado')return resumeBook(id);if(s==='actual'&&b.status==='tumba')return reviveBook(id);if(s==='actual'&&['terminado','terminada','read','done','finished','completed','completado','completada'].includes(String(b.status||'').toLowerCase()))return rereadBook(id);if(s==='tumba')return moveToGraveyard(id);if(s==='pausado'&&['actual','reading','reading_now','currently_reading'].includes(String(b.status||'').toLowerCase())){b.status='pausado';b.pausedAt=new Date().toISOString().slice(0,10);save();render();toast('Lectura pausada. Puedes retomarla cuando quieras.');return}toast('Ese cambio de estado no está permitido para este libro.')}
function finishBook(id){let beforeMonth=monthFinished(localDate().slice(0,7)).length,beforeYear=finished().filter(x=>(x.finishedAt||'').startsWith(String(new Date().getFullYear()))).length,beforeChallenges=autoReaderChallenges().length,b=bookBy(id);if(!b)return;b.status='terminado';b.progress=100;b.finishedAt=localDate();save();render();celebrateReadingMilestones(beforeMonth,beforeYear,beforeChallenges);toast('¡Libro terminado! No olvides valorarlo ✨')}
function celebrateReadingMilestones(beforeMonth,beforeYear,beforeChallenges=0){const monthCount=monthFinished(localDate().slice(0,7)).length,yearCount=finished().filter(x=>(x.finishedAt||'').startsWith(String(new Date().getFullYear()))).length,challengeCount=autoReaderChallenges().length;let celebrate=false;if(state.settings?.celebrateMonthly!==false&&beforeMonth<Number(state.monthlyGoal||4)&&monthCount>=Number(state.monthlyGoal||4))celebrate=true;if(state.settings?.celebrateAnnual!==false&&beforeYear<Number(state.goal||24)&&yearCount>=Number(state.goal||24))celebrate=true;if(state.settings?.celebrateChallenges!==false&&challengeCount>beforeChallenges)celebrate=true;if(celebrate)launchConfetti()}
function editProgress(id){let b=bookBy(id);modal(`<div class="modalhead"><h3>Actualizar avance</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Porcentaje leído</label><input id="progressEdit" type="number" min="0" max="100" value="${Number(b.progress)||0}"></div><div class="form-actions"><button class="btn" onclick="saveProgress('${id}')">Guardar avance</button></div>`)}function saveProgress(id){let n=Math.max(0,Math.min(100,Number(document.getElementById('progressEdit').value)||0)),b=bookBy(id);if(!b)return;let beforeMonth=monthFinished(localDate().slice(0,7)).length,beforeYear=finished().filter(x=>(x.finishedAt||'').startsWith(String(new Date().getFullYear()))).length,beforeChallenges=autoReaderChallenges().length;b.progress=n;let k=localDate();state.readingDays[k]=true;if(n===100){b.status='terminado';b.finishedAt=k}save();closeModal();render();if(n===100)celebrateReadingMilestones(beforeMonth,beforeYear,beforeChallenges);toast('Avance guardado 📖')}

async function configureReminder(){if(!('Notification' in window)){toast('Este navegador no admite notificaciones.');return}let permission=Notification.permission;if(permission!=='granted')permission=await Notification.requestPermission();if(permission!=='granted'){toast('Activa los permisos de notificación en tu navegador.');return}modal(`<div class="modalhead"><h3>Tu recordatorio lector</h3><button class="close" onclick="closeModal()">×</button></div><p class="muted small">Elige a qué hora quieres que Entre Páginas te invite a leer.</p><form onsubmit="saveReminder(event)"><div class="field"><label>Hora del recordatorio</label><input name="time" type="time" value="${esc(state.reminderTime||'20:00')}" required></div><div class="form-actions"><button class="btn" type="submit">Activar recordatorio 🔔</button></div><p class="muted small">Para esta versión, el recordatorio funciona mientras Entre Páginas esté abierto en el navegador. No puede garantizar avisos si el navegador está cerrado.</p></form>`)}
function saveReminder(e){e.preventDefault();state.reminderTime=new FormData(e.target).get('time')||'20:00';state.reminderEnabled=true;state.lastReminderDate='';save();closeModal();updateReminderTimer();toast('Recordatorio activado para las '+state.reminderTime+' 🔔')}
async function toggleLoanReminder(id,on){let b=bookBy(id);if(!b)return;if(on&&'Notification' in window&&Notification.permission!=='granted'){let permission=await Notification.requestPermission();if(permission!=='granted'){toast('Permite las notificaciones para activar el recordatorio.');return}}b.loanReminder=on;save();updateReminderTimer();updateLoanReminderCheck();toast(on?'Recordatorio de devolución activado':'Recordatorio de devolución desactivado')}function localDateOffset(days){let d=new Date();d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function updateLoanReminderCheck(){if(!('Notification' in window)||Notification.permission!=='granted')return;let today=localDate(),tomorrow=localDateOffset(1);(state.books||[]).filter(b=>b.acquisition==='Me lo prestaron'&&b.loanReminder&&b.loanDue&&(b.loanDue===today||b.loanDue===tomorrow)&&b.loanNotifiedDate!==today).forEach(b=>{try{new Notification(b.loanDue===today?'Hoy debes devolver un libro 📚':'Mañana debes devolver un libro 📚',{body:`${b.title} · Devuélvelo a ${b.loanFrom||'quien te lo prestó'}.`});b.loanNotifiedDate=today;save()}catch(e){}})}
let reminderTimer=null,loanTimer=null;function updateReminderTimer(){if(reminderTimer)clearInterval(reminderTimer);if(loanTimer)clearInterval(loanTimer);if('Notification' in window&&Notification.permission==='granted'){updateLoanReminderCheck();loanTimer=setInterval(updateLoanReminderCheck,60000)}if(!state.reminderEnabled||!('Notification' in window)||Notification.permission!=='granted')return;reminderTimer=setInterval(()=>{updateLoanReminderCheck();let now=new Date(),date=localDate(),time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;if(time===state.reminderTime&&state.lastReminderDate!==date&&todayMinutes()<(Number(state.dailyGoal)||20)){try{new Notification('Un ratito para ti 📚',{body:`Es hora de leer. Tu meta de hoy es ${state.dailyGoal} minutos. ¡Tú puedes!`});state.lastReminderDate=date;save()}catch(e){}}},30000)}
function launchConfetti(){let root=document.createElement('div');root.className='confetti-layer';root.setAttribute('aria-hidden','true');for(let i=0;i<100;i++){let bit=document.createElement('i');bit.style.left=Math.random()*100+'%';bit.style.animationDelay=Math.random()*.8+'s';bit.style.setProperty('--drift',(Math.random()*180-90)+'px');bit.style.background=['#A77B62','#DCCBB5','#879578','#EADBD8','#4A3428','#E3C99D'][i%6];root.appendChild(bit)}document.body.appendChild(root);setTimeout(()=>root.remove(),4000)}

function renderReadingTimerSheet(id){let b=bookBy(id);if(!b)return;let running=!!b.readingTimerStarted,seconds=readingElapsedNow(b);modal(`<div class="reading-timer-sheet" style="min-height:70vh;display:flex;flex-direction:column;justify-content:space-between;padding:10px 2px"><div style="display:flex;justify-content:space-between;align-items:center"><button class="iconbtn" aria-label="Cancelar y cerrar" onclick="cancelReadingTimer('${id}')">×</button><button class="btn secondary" onclick="finishReadingSession('${id}')">✓ Terminar sesión</button></div><div style="text-align:center;padding:24px 0"><div id="readingClockValue" style="font-size:clamp(38px,12vw,56px);font-variant-numeric:tabular-nums;color:var(--walnut)">${timerClockHTML(seconds)}</div><div id="readingClockState" class="muted" style="margin:0 0 24px">${running?'Leyendo…':'En pausa'}</div><button class="timer-play-button" style="width:86px;height:86px;border-radius:50%;border:7px solid var(--profile-sage);background:var(--walnut);color:var(--paper);font-size:32px" onclick="${running?`pauseReadingTimer('${id}')`:`resumeReadingTimer('${id}')`}">${running?'Ⅱ':'▶'}</button><div style="margin-top:25px"><button class="btn outline" onclick="setReadingCountdown('${id}')">⏱ Establecer cuenta regresiva</button></div></div><div class="card" style="display:flex;gap:14px;align-items:center;box-shadow:none">${cover(b,true)}<div style="flex:1;min-width:0"><strong>${esc(b.title)}</strong><div class="muted small">${esc(b.author||'')}</div><div class="muted small">${Number(b.progress)||0}% leído</div><button class="text-button" onclick="quickBookNote('${id}')">Lista de notas</button></div><button class="iconbtn" aria-label="Agregar nota" onclick="quickBookNote('${id}')">▤＋</button></div></div>`);document.querySelector('.modalback')?.classList.add('reading-session-modal');clearInterval(window.readingClockInterval);window.readingClockInterval=setInterval(()=>{let current=bookBy(id),el=document.getElementById('readingClockValue');if(!current||!el)return;el.textContent=timerClockHTML(readingElapsedNow(current))},1000)}
